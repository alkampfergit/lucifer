name: Deploy to Azure Container Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: ${{ vars.AZURE_CONTAINER_APP_NAME != '' && vars.AZURE_CONTAINER_APP_ENVIRONMENT != '' && vars.AZURE_CONTAINER_REGISTRY_NAME != '' && vars.AZURE_RESOURCE_GROUP != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate application
        run: npm run lint && npm run test && npm run check:structure

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and deploy container app
        uses: azure/container-apps-deploy-action@v1
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          acrName: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
          containerAppName: ${{ vars.AZURE_CONTAINER_APP_NAME }}
          resourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          containerAppEnvironment: ${{ vars.AZURE_CONTAINER_APP_ENVIRONMENT }}
          imageToBuild: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}.azurecr.io/lucifer:${{ github.sha }}
          targetPort: 3001
          ingress: external
          environmentVariables: NODE_ENV=production
          disableTelemetry: true
