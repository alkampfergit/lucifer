name: CI

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/copilot-instructions.md'
  push:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/copilot-instructions.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # Windows is not incidental here: "tls.source": "windows-store" calls the
    # Windows CryptoAPI, and the only way to exercise it is to build and test
    # on a Windows runner.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Plants a throwaway certificate so the windows-store integration test
      # runs against a real store instead of being skipped. The private key
      # never leaves the runner; only the public half is written to disk.
      - name: Plant a TLS test certificate in the Windows certificate store
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dnsName = 'lucifer-ci.test'
          $cert = New-SelfSignedCertificate `
            -DnsName $dnsName `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyExportPolicy Exportable `
            -KeyAlgorithm RSA -KeyLength 2048 `
            -NotAfter (Get-Date).AddDays(1) `
            -FriendlyName 'Lucifer CI TLS test'

          $pemPath = Join-Path $env:RUNNER_TEMP 'lucifer-ci-test.pem'
          $body = [Convert]::ToBase64String($cert.RawData, 'InsertLineBreaks')
          $pem = "-----BEGIN CERTIFICATE-----`r`n" + $body + "`r`n-----END CERTIFICATE-----`r`n"
          [System.IO.File]::WriteAllText($pemPath, $pem)

          "LUCIFER_TEST_WINDOWS_STORE_DNS_NAME=$dnsName" >> $env:GITHUB_ENV
          "LUCIFER_TEST_WINDOWS_STORE_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          "LUCIFER_TEST_WINDOWS_STORE_CERT_PEM=$pemPath" >> $env:GITHUB_ENV

      # A second, *chained* certificate: root -> intermediate -> leaf, with the
      # issuers left in the containers as public-only copies. A self-signed leaf
      # alone cannot catch two things this one does: that the export stages
      # certificates without a private key, and that the intermediate is
      # actually sent to the client.
      - name: Plant a chained TLS test certificate in the Windows certificate store
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $chainDnsName = 'lucifer-ci-chained.test'
          $expiry = (Get-Date).AddDays(1)

          # Issuers are created in My because signing needs their private key,
          # then copied public-only into the containers the chain walk reads
          # and deleted from My along with their keys.
          $root = New-SelfSignedCertificate `
            -Subject 'CN=Lucifer CI Test Root' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyUsage CertSign,CRLSign -KeyExportPolicy Exportable `
            -KeyAlgorithm RSA -KeyLength 2048 -NotAfter $expiry `
            -TextExtension @('2.5.29.19={text}CA=true&pathlength=1')

          $intermediate = New-SelfSignedCertificate `
            -Subject 'CN=Lucifer CI Test Intermediate' `
            -Signer $root `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -KeyUsage CertSign,CRLSign -KeyExportPolicy Exportable `
            -KeyAlgorithm RSA -KeyLength 2048 -NotAfter $expiry `
            -TextExtension @('2.5.29.19={text}CA=true&pathlength=0')

          New-SelfSignedCertificate `
            -DnsName $chainDnsName `
            -Signer $intermediate `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -Type SSLServerAuthentication `
            -KeyExportPolicy Exportable `
            -KeyAlgorithm RSA -KeyLength 2048 -NotAfter $expiry `
            -FriendlyName 'Lucifer CI chained TLS test' | Out-Null

          function Move-ToContainer($certificate, $containerName) {
            $publicOnly = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($certificate.RawData)
            $container = [System.Security.Cryptography.X509Certificates.X509Store]::new($containerName, 'CurrentUser')
            $container.Open('ReadWrite')
            $container.Add($publicOnly)
            $container.Close()
            Remove-Item -Path "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -Force
          }

          # Both go to CA, including the root. Adding to CurrentUser\Root raises
          # a confirmation dialog that a runner has no way to answer, and the
          # chain walk reads CA and Root alike -- it finds the root there, sees
          # it is self-signed and stops, which is the behaviour under test.
          Move-ToContainer $intermediate 'CA'
          Move-ToContainer $root 'CA'

          # Only the root is handed to the test client, so the handshake can
          # only succeed if the listener sent the intermediate itself.
          $rootPemPath = Join-Path $env:RUNNER_TEMP 'lucifer-ci-chain-root.pem'
          $rootBody = [Convert]::ToBase64String($root.RawData, 'InsertLineBreaks')
          [System.IO.File]::WriteAllText(
            $rootPemPath,
            "-----BEGIN CERTIFICATE-----`r`n" + $rootBody + "`r`n-----END CERTIFICATE-----`r`n")

          "LUCIFER_TEST_WINDOWS_STORE_CHAIN_DNS_NAME=$chainDnsName" >> $env:GITHUB_ENV
          "LUCIFER_TEST_WINDOWS_STORE_CHAIN_ROOT_PEM=$rootPemPath" >> $env:GITHUB_ENV

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Structural checks
        run: npm run check:structure

      - name: Build
        run: npm run build

  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.calc.outputs.version }}
      channel: ${{ steps.calc.outputs.channel }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Calculate version
        id: calc
        run: |
          # Get the nearest tag (semver format)
          NEAREST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          echo "Nearest tag: $NEAREST_TAG"

          # Strip leading 'v' if present
          BASE_VERSION="${NEAREST_TAG#v}"
          echo "Base version: $BASE_VERSION"

          # Count commits since tag
          COMMITS_SINCE=$(git rev-list "${NEAREST_TAG}..HEAD" --count 2>/dev/null || echo "0")
          echo "Commits since tag: $COMMITS_SINCE"

          # Short SHA for uniqueness
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          echo "Short SHA: $SHORT_SHA"

          # Determine channel based on branch
          BRANCH="${GITHUB_REF_NAME}"
          # For PRs, use the head ref
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BRANCH="${GITHUB_HEAD_REF}"
          fi
          echo "Branch: $BRANCH"

          if [ "$BRANCH" = "master" ] || [ "$BRANCH" = "main" ]; then
            if [ "$COMMITS_SINCE" = "0" ]; then
              CHANNEL="stable"
              VERSION="${BASE_VERSION}"
            else
              # Intermediate build on master — use rc prerelease, not a semver bump.
              # The next stable version is decided by the human who creates the tag.
              CHANNEL="rc"
              VERSION="${BASE_VERSION}-rc.${COMMITS_SINCE}.${SHORT_SHA}"
            fi
          elif echo "$BRANCH" | grep -qE '^release/'; then
            CHANNEL="beta"
            VERSION="${BASE_VERSION}-beta.${COMMITS_SINCE}.${SHORT_SHA}"
          else
            CHANNEL="alpha"
            VERSION="${BASE_VERSION}-alpha.${COMMITS_SINCE}.${SHORT_SHA}"
          fi

          echo "Computed version: $VERSION"
          echo "Channel: $CHANNEL"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

  publish-npm:
    needs: [validate, version]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run build

      - name: Set version and publish
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          CHANNEL="${{ needs.version.outputs.channel }}"
          echo "Publishing lucifer-gate@${VERSION} (tag: ${CHANNEL})"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

          if [ "$CHANNEL" = "stable" ]; then
            npm publish --access public --provenance
          elif [ "$CHANNEL" = "beta" ]; then
            npm publish --tag beta --access public --provenance
          elif [ "$CHANNEL" = "rc" ]; then
            npm publish --tag rc --access public --provenance
          else
            npm publish --tag alpha --access public --provenance
          fi

  build-docker:
    needs: [validate, version]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          CHANNEL="${{ needs.version.outputs.channel }}"
          echo "Building Docker image: lucifer-gate:${VERSION}"

          docker build \
            --tag "lucifer-gate:${VERSION}" \
            --tag "lucifer-gate:${CHANNEL}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            .

          echo "Docker image built successfully"
          docker images lucifer-gate
